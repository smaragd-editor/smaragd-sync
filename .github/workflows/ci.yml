name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Protocol + server (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/smaragd-sync-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      # Always builds (catching a broken Dockerfile on PRs) and loads the image locally
      # so it can be started and checked before anything is published.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: smaragd-sync-server/Dockerfile
          load: true
          tags: smaragd-sync-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the image as the self-hosting guide does: health check, /data permissions
      # for the non-root user, admin-token gate, `admin` via docker exec, restart.
      - name: Smoke test the image
        run: scripts/sync-server-smoke-test.sh smaragd-sync-server:ci

      # Tags only, and only after the smoke test passed; the layers come from the cache.
      - name: Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: smaragd-sync-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
